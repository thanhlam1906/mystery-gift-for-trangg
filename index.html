<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Đồng Hoa Tháng Mười</title>
<meta name="description" content="Một món quà nhỏ cho ngày 20/10.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Dancing+Script:wght@600;700&display=swap">
<style>
:root{
  /* Layout: full-bleed WebGL scene; quiet HTML titles sit in the lower third like a film card, and the letter floats over the room as a paper sheet. */
  --night:#120f1c;
  --plum:#2a2238;
  --paper:#f4ecdb;
  --paper-edge:#e3d4b4;
  --ink:#3b2a1f;
  --ink-soft:#7f6857;
  --amber:#ffc978;
  --amber-deep:#e8994a;
  --mist:#fff4e4;
  --mist-dim:rgba(255,244,228,.74);
  --font-hand:"Dancing Script","Segoe Script","Apple Chancery",cursive;
  --font-serif:"Cormorant Garamond","Iowan Old Style","Times New Roman",serif;
  --font-ui:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--night);color:var(--mist);font-family:var(--font-ui);overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none;cursor:grab}
#scene:active{cursor:grabbing}
.vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(125% 95% at 50% 45%,transparent 58%,rgba(12,8,22,.45) 100%)}
button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:2px solid var(--amber);outline-offset:3px}
.overlay{position:fixed;inset:0;box-sizing:border-box;
  padding-top:max(24px,env(safe-area-inset-top,0px));padding-bottom:max(24px,env(safe-area-inset-bottom,0px));
  padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.fade{transition:opacity 1.2s ease}
.fade.out{opacity:0;pointer-events:none}

/* Intro: film-title card in the lower third */
.intro{display:flex;flex-direction:column;justify-content:flex-end;
  background:linear-gradient(to top,rgba(18,15,28,.88) 0%,rgba(18,15,28,.5) 28%,rgba(18,15,28,.12) 52%,rgba(18,15,28,0) 70%)}
.intro-inner{max-width:34rem;display:flex;flex-direction:column;align-items:flex-start;gap:14px;padding-bottom:8px}
.eyebrow{margin:0;font-size:12px;letter-spacing:.32em;text-transform:uppercase;color:var(--amber);font-weight:500}
.intro h1{margin:0;font-family:var(--font-hand);font-weight:700;font-size:clamp(46px,11vw,92px);line-height:1;color:var(--mist);
  text-wrap:balance;text-shadow:0 2px 30px rgba(255,190,120,.25)}
.lede{margin:0;font-family:var(--font-serif);font-style:italic;font-size:clamp(19px,4.6vw,24px);line-height:1.4;color:var(--mist-dim);max-width:28ch;text-wrap:pretty}
.btn-primary{margin-top:8px;border:0;border-radius:999px;padding:14px 30px;background:var(--amber);color:#2b1a0c;font-weight:600;font-size:16px;
  box-shadow:0 8px 30px rgba(255,180,90,.35);transition:transform .2s ease,box-shadow .2s ease}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 10px 36px rgba(255,180,90,.5)}
.btn-primary:active{transform:translateY(1px)}
.fine{margin:0;font-size:13px;color:var(--mist-dim);letter-spacing:.01em}

/* HUD while walking */
.hud{position:fixed;left:0;right:0;bottom:0;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;pointer-events:none;
  padding-bottom:max(18px,env(safe-area-inset-bottom,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
.hint{margin:0;font-size:13px;color:var(--mist);text-shadow:0 1px 8px rgba(0,0,0,.6);max-width:24ch;transition:opacity 1s ease}
.btn-ghost{pointer-events:auto;border:1px solid rgba(255,244,228,.38);border-radius:999px;padding:11px 20px;background:rgba(24,18,34,.38);color:var(--mist);
  font-size:14px;font-weight:500;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);transition:background .2s ease,border-color .2s ease}
.btn-ghost:hover{background:rgba(24,18,34,.6);border-color:rgba(255,244,228,.6)}
.btn-ghost[disabled]{opacity:.7;cursor:default}
.icon-btn{position:fixed;top:calc(max(14px,env(safe-area-inset-top,0px)));right:max(14px,env(safe-area-inset-right,0px));width:42px;height:42px;border-radius:50%;
  border:1px solid rgba(255,244,228,.3);background:rgba(24,18,34,.35);color:var(--mist);display:grid;place-items:center;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.icon-btn svg{width:20px;height:20px}
.toast{position:fixed;left:50%;bottom:calc(max(18px,env(safe-area-inset-bottom,0px)) + 64px);transform:translate(-50%,8px);max-width:min(30rem,calc(100% - 40px));
  margin:0;text-align:center;font-family:var(--font-serif);font-style:italic;font-size:clamp(19px,4.4vw,23px);color:var(--mist);
  text-shadow:0 2px 14px rgba(0,0,0,.7);opacity:0;transition:opacity .9s ease,transform .9s ease;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* Letter */
.letter{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:rgba(14,10,22,.42);transition:background .8s ease}
.paper{position:relative;box-sizing:border-box;width:min(470px,100%);max-height:calc(100% - 96px);overflow:auto;-webkit-overflow-scrolling:touch;
  padding:34px clamp(22px,6vw,38px) 30px;color:var(--ink);border-radius:3px;cursor:default;user-select:text;-webkit-user-select:text;
  background:
    radial-gradient(120% 70% at 15% 0%,rgba(255,255,255,.6),transparent 60%),
    radial-gradient(90% 60% at 100% 100%,rgba(170,130,80,.12),transparent 70%),
    repeating-linear-gradient(to bottom,transparent 0 30px,rgba(120,90,60,.07) 30px 31px),
    linear-gradient(to bottom,transparent 32.6%,rgba(110,80,50,.10) 33.2%,rgba(255,255,255,.45) 33.6%,transparent 34.4%,transparent 65.9%,rgba(110,80,50,.09) 66.5%,rgba(255,255,255,.4) 66.9%,transparent 67.7%),
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .42  0 0 0 0 .32  0 0 0 0 .22  0 0 0 .11 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>"),
    var(--paper);
  background-attachment:local;
  scrollbar-width:thin;scrollbar-color:rgba(120,90,60,.35) transparent;
  -webkit-mask-image:linear-gradient(to bottom,#000 calc(100% - 26px),transparent);mask-image:linear-gradient(to bottom,#000 calc(100% - 26px),transparent);
  box-shadow:0 30px 70px rgba(0,0,0,.5),0 6px 16px rgba(0,0,0,.25),inset 0 0 0 1px var(--paper-edge),inset 0 0 40px rgba(150,110,60,.12);
  opacity:0;transform:perspective(1100px) rotateX(-62deg) translateY(40px) scale(.95);transform-origin:50% 0;
  transition:opacity .8s ease,transform 1.1s cubic-bezier(.2,.8,.2,1)}
.paper.open{opacity:1;transform:rotate(-.5deg)}
.paper::-webkit-scrollbar{width:6px}.paper::-webkit-scrollbar-track{background:transparent}.paper::-webkit-scrollbar-thumb{background:rgba(120,90,60,.3);border-radius:3px}
.l-sign{padding-bottom:22px}
.l-greet{margin:0 0 14px;font-family:var(--font-hand);font-weight:700;font-size:clamp(30px,7.4vw,38px);line-height:1.15;color:var(--ink);opacity:0;transition:opacity 1s ease .2s}
.l-body p{margin:0 0 .75em;font-family:var(--font-serif);font-weight:500;font-size:clamp(18.5px,4.7vw,21px);line-height:1.55;text-wrap:pretty}
.l-close{margin:18px 0 0;font-family:var(--font-serif);font-style:italic;font-size:clamp(18.5px,4.7vw,21px)}
.l-sign{margin:4px 0 0;text-align:right;font-family:var(--font-hand);font-weight:700;font-size:clamp(28px,7vw,34px);color:var(--ink)}
.w{opacity:0;filter:blur(4px);transition:opacity .6s ease,filter .8s ease}
.paper.reveal .w,.paper.reveal .l-greet{opacity:1;filter:none}
.paper.instant .w{transition-delay:0s!important}
.letter .btn-primary{margin-top:0}

/* Finale: the wish written across the sky */
.finale{display:flex;flex-direction:column;justify-content:flex-start;align-items:center;pointer-events:none;
  background:linear-gradient(to bottom,rgba(34,24,58,.5) 0%,rgba(34,24,58,.34) 40%,rgba(34,24,58,.12) 62%,rgba(34,24,58,0) 80%)}
.finale-inner{max-width:40rem;display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center;padding-top:clamp(8px,4vh,36px)}
.finale h2{margin:0;font-family:var(--font-hand);font-weight:700;font-size:clamp(38px,9vw,72px);line-height:1.08;color:#fffaf2;text-wrap:balance;
  text-shadow:0 2px 3px rgba(70,40,60,.35),0 4px 30px rgba(70,40,90,.45)}
.finale .fine{color:#fffaf2;text-shadow:0 1px 8px rgba(40,20,50,.6);opacity:0;transition:opacity 1.2s ease 2.6s}
.finale .ftext{max-width:32rem;margin:0;padding:0 16px;font-size:clamp(16px,4.2vw,20px);line-height:1.55;text-wrap:pretty;transition-delay:2s;text-shadow:0 1px 3px rgba(20,10,30,.75),0 0 18px rgba(20,10,30,.6)}
.finale .btn-ghost{margin-top:6px;opacity:0;transition:opacity 1.2s ease 3.6s,background .2s ease}
.finale.show .w,.finale.show .fine,.finale.show .btn-ghost{opacity:1;filter:none}
.fallback{display:flex;flex-direction:column;justify-content:center;gap:16px;background:var(--plum)}
.fallback h2{margin:0;font-family:var(--font-hand);font-size:44px}
@media (prefers-reduced-motion: reduce){
  .w,.l-greet,.paper,.toast,.fade{transition:none!important}
}
</style>

<canvas id="scene" aria-label="Cánh đồng hoa 3D"></canvas>
<div class="vignette" aria-hidden="true"></div>

<section id="intro" class="overlay intro fade">
  <div class="intro-inner">
    <p class="eyebrow">20 · 10 · 2026</p>
    <h1 id="introTitle">Gửi em</h1>
    <p id="introLine" class="lede"></p>
    <button id="startBtn" class="btn-primary" type="button">Bắt đầu</button>
    <p id="controlsHint" class="fine"></p>
  </div>
</section>

<div id="hud" class="hud" hidden>
  <p id="hint" class="hint"></p>
  <button id="guideBtn" class="btn-ghost" type="button"></button>
</div>
<p id="toast" class="toast" role="status" aria-live="polite"></p>

<button id="muteBtn" class="icon-btn" type="button" aria-label="Tắt tiếng" hidden>
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/>
    <path id="muteWave" d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/>
    <path id="muteX" d="M16 9.5l5 5M21 9.5l-5 5" style="display:none"/>
  </svg>
</button>

<section id="letter" class="overlay letter" hidden>
  <article id="paper" class="paper" aria-label="Lá thư">
    <h2 id="lGreeting" class="l-greet"></h2>
    <div id="lBody" class="l-body"></div>
    <p id="lClosing" class="l-close"></p>
    <p id="lSign" class="l-sign"></p>
  </article>
  <button id="windowBtn" class="btn-primary" type="button" hidden>Nhìn ra cửa sổ</button>
</section>

<section id="finale" class="overlay finale fade out" hidden>
  <div class="finale-inner">
    <h2 id="fLine"></h2>
    <p id="fText" class="fine ftext"></p>
    <p id="fSub" class="fine"></p>
    <button id="againBtn" class="btn-ghost" type="button">Đi lại từ đầu</button>
  </div>
</section>

<section id="fallback" class="overlay fallback" hidden>
  <h2>Gửi em</h2>
  <p class="lede">Máy này chưa mở được cảnh 3D, nhưng lá thư vẫn ở đây.</p>
  <button id="fallbackBtn" class="btn-primary" type="button">Mở thư</button>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script>
(function(){
'use strict';

/* =====================================================================
   NỘI DUNG — sửa ở đây
   ===================================================================== */
const CONFIG = {
  name: 'Trang',                     // tên hiện trên cánh đồng (ngắn thì rõ hơn)
  you: 'em',                         // cách gọi người nhận
  me: 'anh',                         // người gửi xưng
  flower: 'tulip',                   // 'tulip' = tulip nhiều màu · 'daisy' = cúc họa mi trắng · 'buckwheat' = tam giác mạch hồng
  introTitle: 'Gửi Trang',
  introLine: 'Đeo tai nghe vào nhé, có nhạc đó.',
  letter: {
    greeting: 'Gửi Trang,',
    paragraphs: [
      'Hôm nay 20/10, anh muốn gửi em một lời chúc, mà nhắn tin thì bình thường quá, nên anh làm thử cái này.',
      'Mới quen có mấy hôm mà làm hẳn một cánh đồng thì cũng hơi quá tay thật. Nhưng anh là chuyên gia bất ngờ mà, hy vọng điều này không nằm trong những suy đoán của em.',
      'Anh không định nói gì to tát đâu. Chỉ mong hôm nay em nhận được thật nhiều lời chúc dễ thương, được ăn món mình thích, và có nhiều lý do để cười.',
      'Chúc em một ngày 20/10 thật vui. Nếu em không ngại, anh mong sẽ còn được nghe em kể thêm nhiều chuyện nữa.',
      'À, trước khi đi thì nhìn ra cửa sổ một chút nhé.'
    ],
    closing: 'Hẹn nói chuyện tiếp nhé,',
    signature: 'Anh'
  },
  closingLine: 'Chúc Trang một ngày 20/10 thật vui!',   // lời chúc hiện trên bầu trời ở cảnh cuối
  closingText: 'Chúc em một ngày thật nhiều niềm vui, nhiều lời chúc và thật nhiều nụ cười.',
  closingSub: 'Ngày Phụ nữ Việt Nam · 20.10.2026',
  nameInField: false,                // true = trồng tên người nhận thành chữ trên cánh đồng
  musicUrl: ''                       // để trống = nhạc tự sinh · hoặc 'music.mp3' đăng kèm trang
};

const T = {
  hintTouch: 'Chạm giữ để đi · kéo để nhìn quanh',
  hintMouse: 'Giữ chuột hoặc phím W để đi · kéo để nhìn quanh',
  guide: 'Dẫn đường giúp ' + CONFIG.you,
  guiding: 'Đang dẫn đường…',
  windowLit: 'Có tiếng chuông gió… đi theo hàng hoa vàng nhé.',
  table: 'Chạm vào lá thư',
  tableAlt: 'Chạm vào lá thư, hoặc bó hoa',
  card: 'Tặng ' + CONFIG.you + ' · 20.10'
};

/* ===================================================================== */
const $ = id => document.getElementById(id);
const isCoarse = matchMedia('(pointer: coarse)').matches;
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const clamp = (v,a,b) => Math.min(b, Math.max(a, v));
const lerp = (a,b,t) => a + (b - a) * t;
const smooth = (a,b,x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const ease = t => t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2;
function rng(seed){ let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }
const R = rng(20102026);
const angLerp = (a, b, t) => { let d = ((b - a + Math.PI) % (Math.PI*2) + Math.PI*2) % (Math.PI*2) - Math.PI; return a + d * t; };

/* ---------- texts into DOM ---------- */
$('introTitle').textContent = CONFIG.introTitle;
$('introLine').textContent = CONFIG.introLine;
$('controlsHint').textContent = isCoarse ? T.hintTouch : T.hintMouse;
$('guideBtn').textContent = T.guide;
(() => { const el = $('fLine'), words = CONFIG.closingLine.split(/\s+/).filter(Boolean);
  words.forEach((w, i) => { const sp = document.createElement('span'); sp.className = 'w'; sp.textContent = w + (i < words.length - 1 ? ' ' : ''); sp.style.transitionDelay = (0.3 + i * (reduceMotion ? 0 : 0.18)).toFixed(2) + 's'; el.appendChild(sp); }); })();
$('fText').textContent = CONFIG.closingText || '';
$('fSub').textContent = CONFIG.closingSub;
document.querySelector('#fallback h2').textContent = CONFIG.introTitle;

/* ---------- letter DOM ---------- */
let letterDur = 4;
function buildLetter(){
  $('lGreeting').textContent = CONFIG.letter.greeting;
  const body = $('lBody'); body.innerHTML = '';
  let k = 0; const per = reduceMotion ? 0 : 0.055;
  const addWords = (el, text) => {
    const words = text.split(/\s+/).filter(Boolean);
    words.forEach((w, i) => {
      const s = document.createElement('span'); s.className = 'w';
      s.textContent = w + (i < words.length - 1 ? ' ' : '');
      s.style.transitionDelay = (0.7 + k * per).toFixed(2) + 's'; k++;
      el.appendChild(s);
    });
  };
  CONFIG.letter.paragraphs.forEach(par => { const p = document.createElement('p'); addWords(p, par); body.appendChild(p); });
  const c = $('lClosing'); c.innerHTML = ''; addWords(c, CONFIG.letter.closing);
  const sg = $('lSign'); sg.innerHTML = ''; addWords(sg, CONFIG.letter.signature);
  letterDur = 0.7 + k * per + 0.7;
}
buildLetter();

let letterTimer = null;
function showLetter(){
  const L = $('letter'), paper = $('paper');
  L.hidden = false; $('windowBtn').hidden = true;
  paper.classList.remove('open', 'reveal', 'instant');
  paper.scrollTop = 0;
  void paper.offsetWidth;
  requestAnimationFrame(() => { paper.classList.add('open'); setTimeout(() => paper.classList.add('reveal'), 60); });
  clearTimeout(letterTimer);
  letterTimer = setTimeout(() => { $('windowBtn').hidden = false; }, letterDur * 1000);
  // keep the line being written in view, unless the reader scrolls by hand
  followTimers.forEach(clearTimeout); followTimers = []; paper.dataset.manual = '';
  [...paper.querySelectorAll('#lBody p, #lClosing, #lSign')].forEach(el => {
    const first = el.querySelector('.w'); if (!first) return;
    followTimers.push(setTimeout(() => {
      if (paper.dataset.manual || paper.classList.contains('instant')) return;
      const bottom = el.offsetTop + el.offsetHeight + 34;
      if (bottom > paper.scrollTop + paper.clientHeight) paper.scrollTo({ top: bottom - paper.clientHeight, behavior: reduceMotion ? 'auto' : 'smooth' });
    }, parseFloat(first.style.transitionDelay) * 1000 + 80));
  });
}
let followTimers = [];
['wheel', 'touchmove'].forEach(ev => $('paper').addEventListener(ev, () => { $('paper').dataset.manual = '1'; }, { passive: true }));
$('paper').addEventListener('click', () => {
  const paper = $('paper');
  if (!paper.classList.contains('reveal')) return;
  paper.classList.add('instant'); clearTimeout(letterTimer); $('windowBtn').hidden = false;
});

/* ---------- toast ---------- */
let toastTimer = null;
function toast(msg, sec){
  const el = $('toast'); el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer);
  if (sec) toastTimer = setTimeout(() => el.classList.remove('show'), sec * 1000);
}
function hideToast(){ clearTimeout(toastTimer); $('toast').classList.remove('show'); }

/* ---------- fallback ---------- */
function showFallback(){
  $('intro').hidden = true; $('fallback').hidden = false;
  $('fallbackBtn').onclick = () => { $('fallback').hidden = true; showLetter(); };
}

/* =====================================================================
   RENDERER
   ===================================================================== */
const canvas = $('scene');
let renderer = null;
try { renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' }); }
catch (e) { renderer = null; }
if (!renderer || !renderer.getContext()) { showFallback(); return; }

const Q = isCoarse
  ? { near: 15000, far: 15000, nameExtra: 5000, grassIn: 26000, grassOut: 20000, hd: 1500, hdTile: 13, dpr: 1.5, shadow: 1024, pebbles: 500, tree: 0.62 }
  : { near: 34000, far: 26000, nameExtra: 8000, grassIn: 80000, grassOut: 64000, hd: 4600, hdTile: 18, dpr: 1.75, shadow: 2048, pebbles: 900, tree: 1 };
if (window.__DHTM_LITE) Object.assign(Q, { near: 4000, far: 6000, grassIn: 9000, grassOut: 6000, hd: 700, shadow: 1024, dpr: 1, pebbles: 300, tree: 0.4 });

const maskC = document.createElement('canvas'); maskC.width = maskC.height = MASK_SIZE;

const toPx = v => (v + MASK_WORLD / 2) * PX;

function drawMask(){
  mg.globalCompositeOperation = 'source-over';
  mg.fillStyle = '#000'; mg.fillRect(0, 0, MASK_SIZE, MASK_SIZE);
  mg.globalCompositeOperation = 'lighter';
  // name, rotated 180° so it reads correctly from the final aerial camera
  if (CONFIG.nameInField){
  mg.save();

  mg.rotate(Math.PI);
  const boxW = NAME.w * PX, boxH = NAME.h * PX;
  const fam = '"Dancing Script","Brush Script MT","Segoe Script",cursive';
  let size = boxH;
  mg.font = `700 ${size}px ${fam}`;
  const tw = mg.measureText(CONFIG.name).width;
  if (tw > boxW) { size *= boxW / tw; mg.font = `700 ${size}px ${fam}`; }
  mg.textAlign = 'center'; mg.textBaseline = 'middle';
  mg.fillStyle = 'rgb(255,0,0)'; mg.strokeStyle = 'rgb(255,0,0)';
  mg.lineWidth = 1.5 * PX; mg.lineJoin = 'round';
  mg.strokeText(CONFIG.name, 0, size * 0.04);
  mg.fillText(CONFIG.name, 0, size * 0.04);
  mg.restore();
  }
  // worn trail (B channel): a wide soft edge and a packed core, with a slight wander
  {
    const tr = rng(31), sp = TRAIL.getSpacedPoints(240);
    const pts = sp.map((p, i) => { const q = sp[Math.min(i + 1, sp.length - 1)], o = sp[Math.max(i - 1, 0)], tx = q.x - o.x, tz = q.z - o.z, l = Math.hypot(tx, tz) || 1, w = Math.sin(i * 0.37) * 0.18 + (tr() - 0.5) * 0.12; return [p.x - tz / l * w, p.z + tx / l * w]; });
    const stroke = (width, color) => { mg.strokeStyle = color; mg.lineWidth = width * PX; mg.lineCap = 'round'; mg.lineJoin = 'round'; mg.beginPath(); pts.forEach((p, i) => i ? mg.lineTo(toPx(p[0]), toPx(p[1])) : mg.moveTo(toPx(p[0]), toPx(p[1]))); mg.stroke(); };
    stroke(3.1, 'rgb(0,0,110)'); stroke(1.55, 'rgb(0,0,160)');
  }
  // exclusions: house + yard, tree trunks
  mg.fillStyle = 'rgb(0,255,0)';
  mg.fillRect(toPx(-5), toPx(HOUSE.z - 4.6), 10 * PX, (FRONT_Z + 2.9 - (HOUSE.z - 4.6)) * PX);
  for (const t of TREES){ mg.beginPath(); mg.arc(toPx(t[0]), toPx(t[1]), 1.3 * t[2] * PX, 0, Math.PI * 2); mg.fill(); }
  // red = ground contact shading (only when the name isn't planted in the field)
  if (!CONFIG.nameInField){
    const ring = (x0, z0, x1, z1, grow, a) => { for (let k = 0; k < 12; k++){ const e = grow * k / 11; mg.fillStyle = `rgba(255,0,0,${a})`; mg.beginPath(); mg.rect(toPx(x0 - e), toPx(z0 - e), (x1 - x0 + 2 * e) * PX, (z1 - z0 + 2 * e) * PX); mg.fill(); } };
    ring(HOUSE.x - 3.65, HOUSE.z - 2.9, HOUSE.x + 3.65, HOUSE.z + 2.9, 1.5, 0.05);
    ring(HOUSE.x - 2.3, FRONT_Z, HOUSE.x + 2.3, FRONT_Z + 2.1, 1.0, 0.045);
    for (const t of TREES){
      const r = 1.9 * t[2] * 1.15, cx = toPx(t[0]), cz = toPx(t[1]), gr = mg.createRadialGradient(cx, cz, 0, cx, cz, r * PX);
      gr.addColorStop(0, 'rgba(255,0,0,0.75)'); gr.addColorStop(0.35, 'rgba(255,0,0,0.38)'); gr.addColorStop(1, 'rgba(255,0,0,0)');
      mg.fillStyle = gr; mg.beginPath(); mg.arc(cx, cz, r * PX, 0, Math.PI * 2); mg.fill();
    }
  }

  maskData = mg.getImageData(0, 0, MASK_SIZE, MASK_SIZE).data;
}
function isNameAt(x, z){
  if (!maskData || !CONFIG.nameInField) return false;
  const px = Math.floor(toPx(x)), pz = Math.floor(toPx(z));
  if (px < 0 || pz < 0 || px >= MASK_SIZE || pz >= MASK_SIZE) return false;

  #endif

  float pick2 = 0.06 + 0.88 * fract(aRand.x * 91.7 + aRand.w * 13.3);
  float dm = length(wp - uCenter);
  float band2 = smoothstep(uTile*0.34, uTile*0.47, dm) * (1.0 - smoothstep(uNearR - 2.0, uNearR + 3.0, dm));
  sc *= smoothstep(pick2 - 0.03, pick2 + 0.03, band2) * uNearFade;
  #endif

/* ---------- linear colour pipeline: every hand-picked colour was chosen as an sRGB value ---------- */
function linearizeScene(root){
  const seenM = new Set(), seenA = new Set();
  const linArr = (arr, step) => { for (let i = 0; i < arr.length; i++){ if (step && i % step === 3) continue; const v = arr[i]; arr[i] = v < 0.04045 ? v * 0.0773993808 : Math.pow(v * 0.9478672986 + 0.0521327014, 2.4); } };
  root.traverse(o => {
    if (o.isLight && o.color && !o.isHemisphereLight && !o.isDirectionalLight) o.color.convertSRGBToLinear();
    const mats = Array.isArray(o.material) ? o.material : o.material ? [o.material] : [];
    for (const m of mats){
      if (seenM.has(m) || m.isShaderMaterial) continue; seenM.add(m);
      if (m.color) m.color.convertSRGBToLinear();
      if (m.emissive) m.emissive.convertSRGBToLinear();
      for (const k of ['map', 'emissiveMap']) if (m[k]){ m[k].encoding = THREE.sRGBEncoding; m[k].needsUpdate = true; }
      m.needsUpdate = true;
      if (m.vertexColors && o.geometry && o.geometry.attributes.color && !seenA.has(o.geometry.attributes.color)){
        const a = o.geometry.attributes.color; seenA.add(a); linArr(a.array, a.itemSize === 4 ? 4 : 0); a.needsUpdate = true;
      }
    }
    if (o.isInstancedMesh && o.instanceColor && !seenA.has(o.instanceColor)){ seenA.add(o.instanceColor); linArr(o.instanceColor.array, 0); o.instanceColor.needsUpdate = true; }
  });
}
